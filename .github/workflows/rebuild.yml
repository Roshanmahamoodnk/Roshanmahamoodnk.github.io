name: Rebuild HUBB

on:
  workflow_dispatch:
  repository_dispatch:
    types: [hubb-publish]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: rebuild-hubb
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live site
        uses: actions/checkout@v4
        with:
          path: live

      - name: Checkout HUBB source
        uses: actions/checkout@v4
        with:
          repository: Roshanmahamoodnk/hubb-web
          path: src

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Build static site
        working-directory: src
        env:
          NITRO_PRESET: static
        run: |
          npm ci
          npm run build:render
          git rev-parse HEAD > out/SOURCE_SHA

      - name: Publish to Pages
        working-directory: live
        run: |
          set -euo pipefail
          WANT=$(tr -d '[:space:]' < ../src/out/SOURCE_SHA)
          HAVE=""
          if [ -f SOURCE_SHA ]; then
            HAVE=$(tr -d '[:space:]' < SOURCE_SHA)
          fi
          if [ -n "$WANT" ] && [ "$WANT" = "$HAVE" ]; then
            echo "already current $WANT"
            exit 0
          fi
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a ../src/out/. .
          git config user.name "HUBB live"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no file changes"
            exit 0
          fi
          git commit -m "Publish HUBB ${WANT:0:7}"
          git push
